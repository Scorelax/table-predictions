name: Refresh live standings

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC every day
  workflow_dispatch:          # manual runs from the Actions tab, e.g. for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the current table
        run: python scripts/fetch_standings.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/standings.csv data/deadline.txt; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.csv data/deadline.txt
          git commit -m "Refresh standings: $(date -u +%Y-%m-%d)"
          git push
